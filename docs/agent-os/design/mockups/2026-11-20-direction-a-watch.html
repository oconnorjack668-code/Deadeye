<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">

<title>Deadeye visual direction A (Arena): watch</title>
<!-- Designer proposal 2026-11-20, draft only. Direction A: Arena. Made-up data. Not built, not in docs/design.md.
     Fonts: Google Fonts (OFL). Icons: Phosphor (MIT). Footage frame (watch page): local file, consent confirmed by the founder, do not upload. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0E;--panel:#16161B;--panel2:#1F1F26;--line:#6F6F7C;--hair:#2B2B34;--red:#FF2D4A;--or:#FF6B1A;--or2:#FF9A1F;--amber:#FFC933;
--text:#F7F7F9;--mut:#B8B8C4;--make:#35E08A;--miss:#FF5468;--ink:#0B0B0E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{width:390px;font-family:'Barlow',system-ui,sans-serif;color:var(--text);font-weight:500;-webkit-font-smoothing:antialiased}
.ph{width:1em;height:1em;flex:none;display:block}
.screen{position:relative;width:390px;min-height:844px;overflow:hidden;background:
 linear-gradient(115deg,transparent 0 62%,rgba(255,107,26,.13) 62% 74%,transparent 74% 78%,rgba(255,45,74,.10) 78% 83%,transparent 83%) 0 0/100% 260px no-repeat,var(--bg)}
.pad{padding:0 16px}
.d{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
.num{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;line-height:.9}
.lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--mut)}
.cut{clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.cut-s{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.plate{background:linear-gradient(160deg,#1D1D24,#131318);position:relative}
.plate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);pointer-events:none}
.bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--or2),var(--red))}
.tag{display:inline-block;transform:skewX(-14deg);padding:3px 12px}
.tag>span{display:block;transform:skewX(14deg)}
.tile{width:34px;height:34px;display:grid;place-items:center;font-size:20px;color:var(--ink);background:linear-gradient(135deg,var(--or2),var(--or));clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border:0;font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.03em;font-size:22px;color:var(--ink);background:linear-gradient(100deg,var(--or2),var(--or) 60%,#FF4A1A);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.btn .ph{font-size:24px}
.btn2{background:var(--line);color:var(--text);height:48px;font-size:20px;position:relative}
.btn2::after{content:"";position:absolute;inset:2px;background:#16161B;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);z-index:0}
.btn2>*{position:relative;z-index:1}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#0F0F13;border-top:1px solid var(--hair);display:flex;padding:6px 8px 10px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;position:relative}
.nav a .ph{font-size:26px}
.nav a.on{color:var(--text)}
.nav a.on .ph{color:var(--or)}
.nav a.on::before{content:"";position:absolute;top:-7px;left:22%;right:22%;height:4px;background:var(--or);transform:skewX(-30deg)}
.fab{position:absolute;right:16px;bottom:92px;width:58px;height:58px;display:grid;place-items:center;color:var(--ink);font-size:30px;background:linear-gradient(135deg,var(--or2),var(--or) 55%,#FF4A1A);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);filter:drop-shadow(0 4px 0 #000)}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:12px;background:#2A2A33;transform:skewX(-24deg)}
.seg i.f{background:linear-gradient(90deg,var(--or2),var(--or))}
.hex{width:56px;height:62px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%)}
.hex.lock{background:#2A2A33;color:#8C8C99}
.hex.bronze{background:linear-gradient(160deg,#FFC37A,#C8631F 60%,#8B3F10);color:#2A1204}
.small{font-size:14px;line-height:1.4;color:var(--mut)}
</style>
</head>
<body>
<div class="screen" style="min-height:900px">
 <div class="pad" style="padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end">

 </div>

   <div><div class="d" style="font-size:26px">56% made</div><div class="small" style="margin-top:2px">Watch it back to check the calls</div></div>
  </div>
 </div>

 <div class="pad" style="margin-top:12px">

   <div style="position:relative;width:358px;height:331px;overflow:hidden;background:#000">

    <div style="position:absolute;left:10px;top:10px;background:rgba(11,11,14,.84);padding:6px 14px 8px 18px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);display:flex;align-items:baseline;gap:10px">

    <div style="position:absolute;left:10px;top:122px;background:var(--make);color:var(--ink);padding:3px 22px 3px 14px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);display:flex;align-items:center;gap:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6))">
     <span class="d" style="font-size:40px">Make</span><span style="font-size:26px"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/></svg></span>
    </div>
    <div style="position:absolute;left:10px;bottom:12px;display:flex;gap:5px">
     <i style="width:12px;height:12px;border-radius:50%;background:var(--make)"></i><i style="width:12px;height:12px;border-radius:50%;border:3px solid var(--miss);background:rgba(0,0,0,.4)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--make)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--make)"></i><i style="width:12px;height:12px;border-radius:50%;border:3px solid var(--miss);background:rgba(0,0,0,.4)"></i><i style="width:12px;height:12px;border-radius:50%;border:3px solid var(--miss);background:rgba(0,0,0,.4)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--make)"></i>
    </div>
    <div style="position:absolute;right:10px;bottom:10px;width:44px;height:44px;display:grid;place-items:center;font-size:22px;color:#fff;background:rgba(11,11,14,.84);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M220,48V96a12,12,0,0,1-24,0V77l-35.51,35.52a12,12,0,0,1-17-17L179,60H160a12,12,0,0,1,0-24h48A12,12,0,0,1,220,48ZM95.51,143.51,60,179V160a12,12,0,0,0-24,0v48a12,12,0,0,0,12,12H96a12,12,0,0,0,0-24H77l35.52-35.51a12,12,0,0,0-17-17ZM208,148a12,12,0,0,0-12,12v19l-35.51-35.52a12,12,0,0,0-17,17L179,196H160a12,12,0,0,0,0,24h48a12,12,0,0,0,12-12V160A12,12,0,0,0,208,148ZM77,60H96a12,12,0,0,0,0-24H48A12,12,0,0,0,36,48V96a12,12,0,0,0,24,0V77l35.51,35.52a12,12,0,0,0,17-17Z"/></svg></div>
   </div>

   <div style="padding:6px 16px 0">
    <div style="position:relative;height:30px;margin-top:6px"><i style="position:absolute;left:19px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--make);"></i><i style="position:absolute;left:53px;top:4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--miss);"></i><i style="position:absolute;left:80px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--make);"></i><i style="position:absolute;left:114px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--make);"></i><i style="position:absolute;left:148px;top:4px;width:14px;height:14px;background:var(--amber);transform:rotate(45deg);border-radius:2px;"></i><i style="position:absolute;left:175px;top:4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--miss);"></i><i style="position:absolute;left:203px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--make);box-shadow:0 0 0 3px #fff;"></i><i style="position:absolute;left:243px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--make);"></i><i style="position:absolute;left:284px;top:4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--miss);"></i></div>
    <div style="position:relative;height:44px;margin-top:-6px">

    <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
     <button class="btn" style="width:52px;height:48px;font-size:26px"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg></button>
     <button class="btn btn2" style="width:44px;height:44px;font-size:20px"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88Z"/></svg></button><button class="btn btn2" style="width:44px;height:44px;font-size:20px"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M208,40V216a8,8,0,0,1-16,0V146.77L72.43,221.55A15.95,15.95,0,0,1,48,208.12V47.88A15.95,15.95,0,0,1,72.43,34.45L192,109.23V40a8,8,0,0,1,16,0Z"/></svg></button>
     <div class="num" style="font-size:22px;flex:1;text-align:center;font-style:normal;white-space:nowrap">0:31 <span style="color:var(--mut);font-size:17px">/ 0:48</span></div>
     <button class="btn btn2" style="width:52px;height:44px;font-size:20px"><span>1×</span></button>
    </div>
   </div>

    <div style="display:flex;justify-content:space-between;align-items:center">
     <div><div class="d" style="font-size:24px">Shot 7 <span style="color:var(--mut)">· 0:31</span></div><div class="small">Tracker said Make. Tap to change.</div></div>
     <div class="lbl" style="display:flex;gap:6px;align-items:center;color:var(--text);font-size:15px;height:44px"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H180V36A28,28,0,0,0,152,8H104A28,28,0,0,0,76,36V48H40a12,12,0,0,0,0,24h4V208a20,20,0,0,0,20,20H192a20,20,0,0,0,20-20V72h4a12,12,0,0,0,0-24ZM100,36a4,4,0,0,1,4-4h48a4,4,0,0,1,4,4V48H100Zm88,168H68V72H188ZM116,104v64a12,12,0,0,1-24,0V104a12,12,0,0,1,24,0Zm48,0v64a12,12,0,0,1-24,0V104a12,12,0,0,1,24,0Z"/></svg>Not a shot</div>

     <button class="btn btn2" style="height:52px;font-size:24px;background:var(--miss);color:var(--miss)"><span style="display:flex;gap:8px;align-items:center"><svg class="ph " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"/></svg>Miss</span></button>

 </div>

 <div class="pad" style="margin-top:16px;padding-bottom:20px">
  <div style="display:flex;justify-content:space-between"><div class="lbl" style="color:var(--text)">Every call · 9</div><div class="small" style="font-size:14px">Tap a time to watch that shot</div></div>
